<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>صفحه شطرنج با مهره‌های سفارشی</title>
<style>
  :root{
    --light-square: #f0d9b5;
    --dark-square: #b58863;
    --ivory: #F6F1E6;
    --black-piece: #111111;
    --board-bg: #3b2f22;
    --gap: 6px;
    --board-size: min(92vmin, 640px);
  }

  html,body{height:100%;margin:0;font-family:Tahoma, Arial, sans-serif;background:#efe8de;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}

  /* قاب کلی */
  .board-wrap{
    background:linear-gradient(180deg, rgba(0,0,0,0.06), rgba(255,255,255,0.02));
    padding:14px;
    border-radius:14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    border:6px solid var(--board-bg);
  }

  /* صفحه شطرنج: واکنش‌گرا و مربع */
  .board{
    width: var(--board-size);
    height: var(--board-size);
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-auto-rows: 1fr;
    gap: var(--gap);
    padding:10px;
    border-radius:10px;
    background: transparent;
    box-sizing:border-box;
  }

  /* هر خانه همیشه مربعی و یک اندازه */
  .square{
    width:100%;
    height:100%;
    aspect-ratio: 1 / 1; /* تضمین مربع بودن */
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    box-sizing:border-box;
    position:relative;
    overflow:visible;
    user-select:none;
  }

  .square.light{ background: var(--light-square); }
  .square.dark { background: var(--dark-square); }

  /* حد داخلی خانه (در پشت مهره‌ها) */
  .square::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:6px;
    pointer-events:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), inset 0 -4px 8px rgba(0,0,0,0.06);
    z-index:1;
  }

  /* مهره‌ها همیشه بالای حد‌ها */
  .piece{
    width:86%;
    height:86%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease;
    cursor:grab;
  }

  .piece:active{ cursor:grabbing; }

  /* آیکون SVG پرکننده فقط با currentColor */
  .piece svg{ width:100%; height:100%; display:block; fill:currentColor; }

  /* رنگ‌دهی یکنواخت برای سفید و سیاه */
  .white .piece-icon{ color: var(--ivory); }
  .black .piece-icon{ color: var(--black-piece); }

  /* سایه و برجستگی مهره‌ها */
  .white .piece{ filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18)); }
  .black .piece{ filter: drop-shadow(0 5px 6px rgba(0,0,0,0.45)); }

  .piece:hover{ transform: translateY(-4px); }

  /* ستون‌ها (اختیاری) */
  .coords{ margin-top:10px; display:flex;justify-content:center;gap:6px;color:#3b2f22 }
  .coords span{ width:calc(var(--board-size) / 8 - var(--gap)); text-align:center;font-weight:600;opacity:.9 }

  .note{ margin-top:12px;text-align:center;color:#5b4937; font-size:14px; }
</style>
</head>
<body>
  <div class="board-wrap" role="main" aria-label="صفحه شطرنج">
    <!-- SVG symbols: همه به صورت fill-only (رفع مشکل خطوط و رنگ نامتجانس) -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <!-- King: ساده و خوانا -->
        <symbol id="king" viewBox="0 0 45 45">
          <g>
            <path d="M22.5 4c-0.8 0-1.5 0.7-1.5 1.5V8h-4c-0.8 0-1.4 0.6-1.4 1.4v2.6c0 0.8 0.6 1.4 1.4 1.4h4v2.1c0 0.8 0.7 1.5 1.5 1.5s1.5-0.7 1.5-1.5V13h4c0.8 0 1.4-0.6 1.4-1.4V9.4c0-0.8-0.6-1.4-1.4-1.4h-4V5.5C24 4.7 23.3 4 22.5 4zM12 30c3-5 8-7 10-7s7 2 10 7c-7 5-13 5-13 5s-6 0-13-5z"/>
            <circle cx="22.5" cy="22" r="2.2" opacity="0.06" fill="#000"/>
          </g>
        </symbol>

        <!-- Bishop: میتر ساده -->
        <symbol id="bishop" viewBox="0 0 45 45">
          <g>
            <path d="M22.5 8c-5 5-12 12-12 18 0 5 7 7 12 7s12-2 12-7c0-6-7-13-12-18z"/>
            <path d="M22.5 6v6" fill="#000" opacity="0.06"/>
          </g>
        </symbol>

        <!-- Knight: سر اسب واضح و بدون stroke -->
        <symbol id="knight" viewBox="0 0 45 45">
          <g>
            <path d="M10 30c2-8 12-11 12-11s-1-5 3-8c3-2 7-1 9 1 0 0-2 3-4 5-3 3-1 7-1 7s5 1 6 5c1 4-4 7-4 7s-6 0-16 0c-1 0-3-2-5-5z"/>
            <circle cx="22.5" cy="18.5" r="1.6" opacity="0.12" fill="#000"/>
          </g>
        </symbol>

        <!-- Rook -->
        <symbol id="rook" viewBox="0 0 45 45">
          <g>
            <rect x="12" y="12" width="21" height="4" rx="0.8"/>
            <path d="M12 16v11c0 2 2 4 4 4h13c2 0 4-2 4-4V16" />
            <rect x="14" y="28" width="17" height="4" rx="1"/>
          </g>
        </symbol>

        <!-- Queen -->
        <symbol id="queen" viewBox="0 0 45 45">
          <g>
            <path d="M8 30c6-7 13-9 14-9s8 2 14 9c-7 4-14 4-14 4s-7 0-14-4z"/>
            <path d="M22.5 13c-2 2-3 6-3 6s2 1 3 1 3-1 3-1-1-4-3-6z" opacity="0.06" fill="#000"/>
          </g>
        </symbol>

        <!-- Pawn -->
        <symbol id="pawn" viewBox="0 0 45 45">
          <g>
            <circle cx="22.5" cy="15" r="4.8"/>
            <path d="M14 32c4-3 12-3 17 0-6 4-11 4-17 0z" />
          </g>
        </symbol>
      </defs>
    </svg>

    <!-- صفحه -->
    <div id="board" class="board" aria-hidden="false"></div>

    <!-- حروف ستون (اختیاری) -->
    <div class="coords" aria-hidden="true">
      <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
    </div>

    <div class="note">برای تغییر اندازه مهره‌ها، رنگ عاجی یا جزئیات بیشتر در SVGها بگو تا ویرایش کنم.</div>
  </div>

<script>
  const boardEl = document.getElementById('board');
  const files = ['a','b','c','d','e','f','g','h'];
  const ranks = [8,7,6,5,4,3,2,1];

  function makeSquare(file,rank) {
    const sq = document.createElement('div');
    const index = (files.indexOf(file) + ranks.indexOf(rank)) % 2;
    sq.className = 'square ' + (index===0 ? 'light' : 'dark');
    sq.dataset.square = file+rank;
    sq.setAttribute('role','button');
    sq.setAttribute('aria-label','خانه ' + file + rank);
    return sq;
  }

  // ساخت گرید (پاک و سپس اضافه)
  boardEl.innerHTML = '';
  for (let r of ranks){
    for (let f of files){
      boardEl.appendChild(makeSquare(f,r));
    }
  }

  const pieceMap = {
    'K': {id:'king', color:'white'},
    'Q': {id:'queen', color:'white'},
    'R': {id:'rook', color:'white'},
    'B': {id:'bishop', color:'white'},
    'N': {id:'knight', color:'white'},
    'P': {id:'pawn', color:'white'},
    'k': {id:'king', color:'black'},
    'q': {id:'queen', color:'black'},
    'r': {id:'rook', color:'black'},
    'b': {id:'bishop', color:'black'},
    'n': {id:'knight', color:'black'},
    'p': {id:'pawn', color:'black'}
  };

  const startFEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";

  function placePiece(squareEl, pieceChar){
    if(!pieceChar || !squareEl) return;
    const mapping = pieceMap[pieceChar];
    if(!mapping) return;
    const holder = document.createElement('div');
    holder.className = mapping.color + " piece";
    holder.innerHTML = '<svg class="piece-icon" viewBox="0 0 45 45" aria-hidden="true"><use href="#'+mapping.id+'"></use></svg>';
    // پاک کردن مهره قبلی (در صورت بارگذاری مجدد)
    squareEl.innerHTML = '';
    squareEl.appendChild(holder);
  }

  function loadFEN(fen){
    const rows = fen.split('/');
    let rank = 8;
    for(let r=0;r<rows.length;r++){
      let fileIndex = 0;
      const row = rows[r];
      for(let ch of row){
        if(/\d/.test(ch)){
          fileIndex += parseInt(ch,10);
        } else {
          const file = files[fileIndex];
          const sq = document.querySelector('[data-square="'+file+rank+'"]');
          placePiece(sq, ch);
          fileIndex++;
        }
      }
      rank--;
    }
  }

  loadFEN(startFEN);
</script>
</body>
</html>
